name: Android CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Detekt Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          api-key: ${{ secrets.API_KEY }}

      # Detekt is applied to every module via the stockviewer.* convention plugins.
      # --continue reports findings from all modules instead of stopping at the first.
      - name: Run detekt
        run: ./gradlew detekt --continue

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

  build:
    name: Gradle build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          api-key: ${{ secrets.API_KEY }}

      # Assembles :app plus every core, feature and shared-library module.
      - name: Build with Gradle
        run: ./gradlew assembleDebug

  unit-tests:
    name: Run unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          api-key: ${{ secrets.API_KEY }}

      # Runs testDebugUnitTest in every module; --continue so one failing
      # module does not hide failures in the others.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: |
            **/build/test-results/testDebugUnitTest/**/*.xml
            **/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  instrumentation-tests:
    name: Instrumentation Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          api-key: ${{ secrets.API_KEY }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Only these three modules have androidTest sources. Running the bare
      # connectedDebugAndroidTest task builds/runs it for every Android module
      # (app, all core:*, shared-library:favorites, feature:*), which:
      #  - produces empty/unparsable result XML for modules with no tests
      #    when their (non-existent) runs race against real ones on the
      #    single emulator, and
      #  - can OOM the dex merger when many modules' androidTest APKs are
      #    dexed/merged in parallel on the runner's limited CPU/memory.
      # --no-parallel serializes module execution so dexing and adb access to
      # the one emulator don't contend with each other.
      #
      # createDebugCombinedCoverageReport is scoped to the five modules that
      # actually have test sources: the three feature:*:impl modules (unit +
      # androidTest) plus core:navigation and shared-library:favorites (unit
      # tests only). Running it unscoped would also hit app and every
      # untested API/core module, producing empty reports that skew the
      # combined coverage numbers.
      # It depends on testDebugUnitTest and, where androidTest sources
      # exist, on connectedDebugAndroidTest, so it needs the emulator that's
      # already running in this job (each GitHub Actions job is a fresh
      # runner, so testDebugUnitTest reruns here rather than reusing the
      # unit-tests job's output).
      - name: Run instrumentation tests and coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            ./gradlew --no-parallel --continue
            :feature:list:impl:connectedDebugAndroidTest
            :feature:details:impl:connectedDebugAndroidTest
            :feature:favorites:impl:connectedDebugAndroidTest
            :feature:list:impl:createDebugCombinedCoverageReport
            :feature:details:impl:createDebugCombinedCoverageReport
            :feature:favorites:impl:createDebugCombinedCoverageReport
            :core:navigation:createDebugCombinedCoverageReport
            :shared-library:favorites:createDebugCombinedCoverageReport

      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-test-results
          path: |
            **/build/outputs/androidTest-results/connected/**/*.xml
            **/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/createDebugCombinedCoverageReport/
          if-no-files-found: ignore

  coverage-comment:
    name: Post coverage comment
    needs: instrumentation-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Coverage data comes from :feature:list:impl, :feature:details:impl,
    # :feature:favorites:impl, :core:navigation and :shared-library:favorites
    # only, matching the modules exercised above.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download coverage reports
        uses: actions/download-artifact@v6
        with:
          name: coverage-reports
          path: coverage-reports

      - name: Add coverage to PR
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: coverage-reports/**/createDebugCombinedCoverageReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage Report
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-lines: 60
