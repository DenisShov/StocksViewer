[versions]
agp = "8.13.2"
kotlin = "2.3.0"
ksp = "2.3.4"
coreKtx = "1.17.0"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.9.0"

androidxActivity = "1.12.2"
androidxLifecycle = "2.10.0"
androidxComposeBom = "2026.01.00"
androidxComposeCompiler = "1.5.8"
androidxComposeUiManifest = "1.6.7"
androidxComposeMaterial3 = "1.2.1"
androidxPagingCompose = "3.3.6"
materialIcons = "1.7.3"
androidxNavigation = "2.9.6"

hilt = "2.58"
navigationHilt = "1.3.0"
okhttp = "5.3.2"
retrofit = "3.0.0"
timberVersion = "5.0.1"
secretsVersion = "2.0.1"
jodaTimeVersion = "2.14.0"
coil = "2.7.0"
vico = "2.4.1"
arrow = "2.2.1.1"

deteKtVersion = "1.23.8"
jacoco = "0.8.7"

androidxComposeUiTest = "1.10.1"
archCoreTestingVersion = "2.2.0"
mockkVersion = "1.14.7"
androidxTestExt = "1.1.5"
androidxTestRules = "1.7.0"
androidxTestRunner = "1.5.2"
turbineVersion = "1.2.1"
kluentVersion = "1.73"

[libraries]
# Support libs
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Kotlin Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Compose
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Material 3
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Material icons
material-icons = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }

# AppCompat theme
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# For ViewModels
androidx-lifecycle-runtimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtimeTesting = { group = "androidx.lifecycle", name = "lifecycle-runtime-testing", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewModelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# Paging
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "androidxPagingCompose" }

# Coil
coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Chart library
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# UI Tests
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "androidxComposeUiTest" }
androidx-compose-ui-testManifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-util = { group = "androidx.compose.ui", name = "ui-util" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "navigationHilt" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Retrofit
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }

# Serialization
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Timber
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timberVersion" }

# Joda time
joda-time = { group = "net.danlew", name = "android.joda", version.ref = "jodaTimeVersion" }

# Arrow
arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow" }
arrow-core-retrofit = { group = "io.arrow-kt", name = "arrow-core-retrofit", version.ref = "arrow" }

# Unit tests
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTestingVersion" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockkVersion" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbineVersion" }
androidx-paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "androidxPagingCompose" }
kluent-android = { group = "org.amshove.kluent", name = "kluent-android", version.ref = "kluentVersion" }

# Dependencies of the included build-config
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "io.gitlab.arturbosch.detekt.gradle.plugin", version.ref = "deteKtVersion" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsVersion" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
deteKt = { id = "io.gitlab.arturbosch.detekt", version.ref = "deteKtVersion" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Plugins defined by this project
codewars-android-application = { id = "codewars.android.application", version = "unspecified" }
codewars-android-application-compose = { id = "codewars.android.application.compose", version = "unspecified" }
codewars-android-application-jacoco = { id = "codewars.android.application.jacoco", version = "unspecified" }
codewars-android-application-detekt = { id = "codewars.android.application.detekt", version = "unspecified" }
codewars-android-feature = { id = "codewars.android.feature", version = "unspecified" }
codewars-android-library = { id = "codewars.android.library", version = "unspecified" }
codewars-android-library-compose = { id = "codewars.android.library.compose", version = "unspecified" }
codewars-android-library-jacoco = { id = "codewars.android.library.jacoco", version = "unspecified" }
codewars-jvm-library = { id = "codewars.jvm.library", version = "unspecified" }
codewars-android-hilt = { id = "codewars.android.hilt", version = "unspecified" }
